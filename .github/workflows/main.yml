name: Build Doustan Transport EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pillow pyinstaller

    - name: Build Standalone EXE
      run: |
        pyinstaller --noconfirm --clean --onefile --windowed --name "DoustanTransport" --add-data "assets;assets" app.py

    - name: Upload DoustanTransport EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoustanTransport-Windows
        path: dist/DoustanTransport.exe
        retention-days: 30
